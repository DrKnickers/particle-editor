# CI: web stack + x64 C++ build.
#
# Scope: changes land on `master` via PR. This workflow gates the web stack
# (pnpm/Vitest) and the x64 C++ build before changes reach master.
#
# What this workflow DOES run for the web stack: the `lint` type-check
# (tsc -b — app plus the e2e/site specs), vite build, Vitest (jsdom unit),
# node --test scripts, and the `test:web` Playwright layout lane (headless
# Chromium against the MOCK app via the Vite dev server — real-browser
# DOM-layout checks jsdom can't do; no native host, runs on Linux). On Windows
# it builds both x64 configurations and runs the standalone C++ unit tests (the
# gate's `cpp-unit` lane).
#
# Node comes from web/.nvmrc and pnpm from web/package.json's `packageManager`,
# so CI and a contributor's machine resolve the same toolchain.
#
# What this workflow does NOT do:
#   * native Playwright (test:native). No job here runs it, on any trigger:
#     it launches ParticleEditor.exe + WebView2 over CDP, needs an interactive
#     desktop (CDP blackens the D3D9 viewport on a headless runner), and takes
#     minutes. Run it locally through the gate's `playwright-native` lane.
#     (The `test:web` lane above is a different, CI-friendly thing: mock app,
#     no host, DOM-only.) `workflow_dispatch` only re-runs the jobs below.
#   * x86 builds. The editor is x64-only (WebView2 host bridge); the x86 build
#     leg was removed.

name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    # PRs targeting master get CI checks; the push trigger re-validates the
    # merged state. The `if:` guard on the cpp job keeps the heavy C++ legs
    # from running on forks of this repo.
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: web (pnpm + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # No `version:` — the action reads `packageManager` from web/package.json,
      # the single pin.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (tsc -b — app + e2e/site specs)
        run: pnpm --filter @particle-editor/editor lint

      - name: Build
        run: pnpm --filter @particle-editor/editor build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/apps/editor/dist
          if-no-files-found: error

      - name: Vitest
        run: pnpm --filter @particle-editor/editor test

      # Before the script tests: the ssim / clip-encode / clip-verify tests
      # skip without ffmpeg, and the landing smoke needs it for placeholder media.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Script tests (node --test)
        run: pnpm --filter @particle-editor/editor test:scripts

      - name: Install Playwright Chromium
        run: pnpm --filter @particle-editor/editor exec playwright install --with-deps chromium

      - name: Web layout lane (Playwright, headless Chromium, mock app)
        run: pnpm --filter @particle-editor/editor test:web

      - name: Landing page smoke (Playwright, static site/)
        run: pnpm --filter @particle-editor/editor test:site

  cpp:
    name: C++ (x64)
    needs: web
    # Run the heavy 2x-billed Windows C++ legs ONLY on this repository, not on
    # forks of it (a fork's Actions minutes are its owner's, and a fork PR is
    # gated here anyway).
    #
    # Stated POSITIVELY, naming this repository's slug, and that is
    # load-bearing: an exclusion (`!=`) guard has to name the right OTHER
    # repository, and getting that wrong silently skips both build
    # configurations here — the exact opposite of a gate.
    if: github.repository == 'DrKnickers/particle-editor'
    runs-on: windows-latest
    strategy:
      matrix:
        build_config: ['Debug', 'Release']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # BOTH configs need the web bundle now: the C++ build embeds
      # web/apps/editor/dist into the exe (GenerateEmbeddedWebAssets target), so a
      # Debug build without dist fails at that step just like Release. (Formerly
      # only Release consumed it, at runtime.)
      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/apps/editor/dist

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install DirectX SDK (June 2010)
        shell: pwsh
        run: |
          $sdk = "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)"
          $header = Join-Path $sdk "Include\d3dx9.h"
          # The choco `directx-sdk` package declares a `dotnet3.5` dependency
          # whose install intermittently fails on the GitHub runner image
          # ("Value cannot be null"), aborting the whole step with a non-zero
          # exit even though the SDK headers/libs the build actually needs
          # install fine. Skip that dependency, retry the occasionally-flaky
          # download, and gate success on the SDK ACTUALLY being present
          # (d3dx9.h) rather than on choco's exit code.
          for ($i = 1; $i -le 3 -and -not (Test-Path $header); $i++) {
            Write-Host "DirectX SDK install attempt $i..."
            choco install directx-sdk -y --no-progress --ignore-dependencies
            if (-not (Test-Path $header)) { Start-Sleep -Seconds 15 }
          }
          if (-not (Test-Path $header)) {
            Write-Error "DirectX SDK not found at $header after 3 attempts."
            exit 1
          }
          Write-Host "DirectX SDK present: $header"
          "DXSDK_DIR=$sdk\" >> $env:GITHUB_ENV
          exit 0

      - name: Restore NuGet packages
        run: nuget restore .

      - name: Build ${{ matrix.build_config }}|x64
        run: msbuild /m /p:Configuration=${{ matrix.build_config }} /p:Platform=x64 .

      # The standalone C++ unit tests (tests/test_*.cpp) through the gate's own
      # `cpp-unit` lane, so CI and a local run share one recipe: it restores
      # NuGet, builds the expat static lib in BOTH configs, then builds and runs
      # every test that doesn't need the app exe. Config-independent, so once
      # per matrix run (on the Debug leg). Toolchain comes from tests/_env.bat
      # (vswhere + vcvars64) and the DXSDK_DIR exported above.
      - uses: actions/setup-node@v4
        if: matrix.build_config == 'Debug'
        with:
          node-version-file: web/.nvmrc

      - name: C++ unit tests (gate lane cpp-unit)
        if: matrix.build_config == 'Debug'
        run: node scripts/run-all-tests.mjs --lane cpp-unit

      - name: Package Release artifact smoke
        if: matrix.build_config == 'Release'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'particle-editor-release-stage'
          $zip = Join-Path $env:RUNNER_TEMP 'ParticleEditor-ci.zip'
          .\scripts\package-release.ps1 -Stage $stage -OutZip $zip
