- tablist "Emitter property tabs":
  - tab "Basic" [selected]
  - tab "Appearance"
  - tab "Physics"
- tabpanel "Basic":
  - text: Name
  - textbox "Name": default
  - button "Emitter Timing" [expanded]
  - text: "Initial spawn delay:"
  - textbox "Initial spawn delay:": "0.00"
  - button "Increment": ▲
  - button "Decrement": ▼
  - text: "s Skip time:"
  - textbox "Skip time:": "0.00"
  - button "Increment": ▲
  - button "Decrement": ▼
  - text: "s Freeze time:"
  - textbox "Freeze time:": "0.00"
  - button "Increment": ▲
  - button "Decrement": ▼
  - text: s
  - button "Generation" [expanded]
  - radiogroup "Generation mode":
    - radio "Bursts"
    - text: "Bursts:"
    - textbox "Bursts:" [disabled]: "0"
    - text: "Burst delay:"
    - textbox "Burst delay:" [disabled]: "1.00"
    - text: "s Particles/burst:"
    - textbox "Particles/burst:" [disabled]: "1"
    - radio "Continuous stream" [checked]
    - text: "Particles/second:"
    - textbox "Particles/second:": "1"
    - button "Increment": ▲
    - button "Decrement": ▼
    - radio "Weather particle"
    - text: "Particles:"
    - textbox "Particles:" [disabled]: "1"
    - text: "Distance from camera:"
    - textbox "Distance from camera:" [disabled]: "0.00"
    - text: "units Cube size:"
    - textbox "Cube size:" [disabled]: "500.00"
    - text: units
  - text: "Maximum lifetime:"
  - textbox "Maximum lifetime:": "1.00"
  - button "Increment": ▲
  - button "Decrement": ▼
  - text: "s Minimum lifetime:"
  - textbox "Minimum lifetime:": "100"
  - button "Increment": ▲
  - button "Decrement": ▼
  - text: "%"
  - button "Connection" [expanded]
  - text: Link particles to instance
  - checkbox "Link particles to instance"
  - text: "Emit mode:"
  - combobox "Emit mode:": Disable
  - text: "Emit offset:"
  - textbox "Emit offset:" [disabled]: "0.50"
  - text: units
